name: CI

# Windows-only runners throughout -- Gravity is a Windows-only product (see
# docs/decisions.md), so a cross-platform matrix would only cost time for no coverage
# benefit. Mirrors docs/development.md's documented dev setup exactly (MinGW-w64 GCC, no
# MSVC; the GNU Rust host toolchain; CMake presets) so CI can never silently drift from
# what a contributor's machine actually does.
#
# Philosophy (see docs/local-ci.md): scripts/ci-local.ps1 is now the primary per-commit
# validation path -- it runs the same 4 fast jobs below directly on a developer/agent
# machine, with no GitHub Actions runner required. This workflow remains a merge-time
# safety net (runs on PRs into master, and on pushes to master itself) and hosts the
# installer smoke test, rather than something every feature-branch commit has to wait on.

on:
  push:
    # Narrowed from every branch to just master (this repo's only long-lived branch --
    # confirmed via `git remote show origin`, no `main`). Feature/agent branches validate
    # locally via scripts/ci-local.ps1 instead of firing a full CI run on every commit;
    # master pushes (merges) still get the full remote check.
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Nightly installer-smoke-test cron is commented out, not deleted: GitHub Actions on
  # this repo/account is currently billing/runner-capacity restricted (discovered when 5
  # consecutive pushes all failed within seconds with no runner ever assigned), so an
  # unattended nightly run would just fail and burn quota with nobody watching. Re-enable
  # by uncommenting the two lines below once Actions capacity/billing is sorted; the job
  # itself (installer-smoke-test) is untouched and still runs fine via workflow_dispatch
  # in the meantime.
  # schedule:
  #   - cron: "0 3 * * *"

jobs:
  cpp:
    name: C++ (build + ctest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW-w64 GCC
        # Direct Chocolatey install rather than a wrapper action: egor-tensin/setup-mingw@v2
        # unconditionally tries to delete libpthread.dll.a/libwinpthread.dll.a as a "static
        # workaround" after installing, and throws (aborting the whole step) if the current
        # `mingw` Chocolatey package version doesn't ship those files under that name --
        # confirmed happening with mingw 16.1.0. This does the same install without that
        # unnecessary, version-fragile cleanup.
        run: |
          choco install mingw --no-progress -y
          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          if (-not (Test-Path $mingwBin)) {
            throw "Expected MinGW bin directory not found at $mingwBin -- the mingw Chocolatey package's layout may have changed."
          }
          echo $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git third_party/vcpkg
          third_party\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure (windows-mingw-debug preset)
        run: cmake --preset windows-mingw-debug

      - name: Build
        run: cmake --build --preset windows-mingw-debug

      - name: ctest
        run: ctest --preset windows-mingw-debug --output-on-failure

  python:
    name: Python (unittest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run downloader protocol tests
        # Deliberately the ambient interpreter, not a venv with yt-dlp installed -- this
        # suite specifically verifies the "yt_dlp is not installed" code path for real
        # (see tests/python/test_downloader_protocol.py's module docstring and
        # docs/decisions.md "Python test suite stays unittest, not pytest").
        run: python -m unittest discover -s tests/python

  rust:
    name: Rust (cargo test + clippy)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW-w64 GCC
        # Direct Chocolatey install rather than a wrapper action: egor-tensin/setup-mingw@v2
        # unconditionally tries to delete libpthread.dll.a/libwinpthread.dll.a as a "static
        # workaround" after installing, and throws (aborting the whole step) if the current
        # `mingw` Chocolatey package version doesn't ship those files under that name --
        # confirmed happening with mingw 16.1.0. This does the same install without that
        # unnecessary, version-fragile cleanup.
        run: |
          choco install mingw --no-progress -y
          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          if (-not (Test-Path $mingwBin)) {
            throw "Expected MinGW bin directory not found at $mingwBin -- the mingw Chocolatey package's layout may have changed."
          }
          echo $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install GNU Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustup component add clippy

      - name: cargo test
        # TEMPORARY DIAGNOSTIC -- remove once the STATUS_ENTRYPOINT_NOT_FOUND cause is
        # confirmed (issue #90). The lib test binary links cleanly but dies at process
        # start with 0xc0000139, meaning a DLL it imports doesn't export a symbol it
        # asks for. Prior rounds ruled out a MinGW runtime mismatch (the binary imports
        # no MinGW runtime DLLs at all, which is also why +crt-static was a no-op).
        # This step names the actual missing entrypoint by diffing the binary's import
        # table against the real exports of each system DLL it imports, and records
        # which gcc/ld actually performed the link.
        run: |
          Write-Host "--- linker provenance ---"
          foreach ($t in 'gcc','ld','dlltool') {
            Get-Command $t -All -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "$t -> $($_.Source)" }
          }
          gcc --version | Select-Object -First 1

          cargo test --no-run 2>&1 | Select-Object -Last 3
          $exe = (Get-ChildItem -Recurse -Filter "gravity_desktop_lib-*.exe" target\debug\deps |
                  Select-Object -First 1).FullName
          Write-Host "--- import/export diff for $exe ---"

          $imports = @{}; $cur = $null
          foreach ($line in (objdump -p $exe)) {
            if ($line -match '^\s*DLL Name:\s*(\S+)') {
              $cur = $Matches[1]
              if (-not $imports.ContainsKey($cur)) {
                $imports[$cur] = New-Object System.Collections.Generic.List[string]
              }
              continue
            }
            if ($cur -and $line -match '^\s*[0-9a-f]+\s+(?:\d+|<none>)\s+(\S+)\s*$') {
              $imports[$cur].Add($Matches[1])
            }
          }
          foreach ($dll in $imports.Keys) {
            $path = Join-Path $env:WINDIR "System32\$dll"
            if (-not (Test-Path $path)) { Write-Host "[apiset/absent] $dll"; continue }
            $exports = New-Object System.Collections.Generic.HashSet[string]
            foreach ($l in (objdump -p $path)) {
              if ($l -match '^\s*\[\s*\d+\]\s+(\S+)') { [void]$exports.Add($Matches[1]) }
            }
            if ($exports.Count -eq 0) { Write-Host "[unparsed exports] $dll"; continue }
            $missing = @($imports[$dll] | Where-Object { -not $exports.Contains($_) })
            if ($missing.Count) { Write-Host "MISSING >>> ${dll}: $($missing -join ', ')" }
            else { Write-Host "ok $dll ($($imports[$dll].Count) imports)" }
          }

          Write-Host "--- run WITH choco MinGW on PATH ---"
          & $exe --list | Out-Null; Write-Host "exit=$LASTEXITCODE"
          Write-Host "--- run WITHOUT any mingw dir on PATH (same binary) ---"
          $saved = $env:PATH
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw' }) -join ';'
          & $exe --list | Out-Null; Write-Host "exit=$LASTEXITCODE"
          $env:PATH = $saved

          cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # TEMPORARY EXPERIMENT (issue #90) -- variant B: identical to the `rust` job above but
  # without the Chocolatey MinGW install, so rustc links with whatever toolchain the
  # runner image already provides rather than a GCC 16.x that shadows the rustup GNU
  # toolchain's own version-matched ld/dlltool on PATH.
  rust-experiment-no-choco-mingw:
    name: "EXPERIMENT B: Rust, no choco MinGW"
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: app/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install GNU Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
      - name: Which gcc will link
        run: |
          Get-Command gcc -All -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "gcc -> $($_.Source)" }
          gcc --version | Select-Object -First 1
      - name: cargo test
        run: cargo test

  # TEMPORARY EXPERIMENT (issue #90) -- variant C: the MSVC toolchain, which sidesteps the
  # MinGW import-descriptor question entirely. Recorded as a data point only; the project
  # deliberately targets GNU/MinGW (docs/development.md), so this is not a proposed switch.
  rust-experiment-msvc:
    name: "EXPERIMENT C: Rust on MSVC"
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: app/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install MSVC Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc
      - name: cargo test
        run: cargo test

  frontend:
    name: Frontend (tsc + vite build + vitest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  # Full packaged-installer smoke test: manual (workflow_dispatch) or nightly
  # (schedule) only, per the plan -- this downloads real FFmpeg/Python vendor artifacts
  # and runs a real `tauri build`, both too slow for every push/PR.
  installer-smoke-test:
    name: Full NSIS installer build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [cpp, rust, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW-w64 GCC
        # Direct Chocolatey install rather than a wrapper action: egor-tensin/setup-mingw@v2
        # unconditionally tries to delete libpthread.dll.a/libwinpthread.dll.a as a "static
        # workaround" after installing, and throws (aborting the whole step) if the current
        # `mingw` Chocolatey package version doesn't ship those files under that name --
        # confirmed happening with mingw 16.1.0. This does the same install without that
        # unnecessary, version-fragile cleanup.
        run: |
          choco install mingw --no-progress -y
          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          if (-not (Test-Path $mingwBin)) {
            throw "Expected MinGW bin directory not found at $mingwBin -- the mingw Chocolatey package's layout may have changed."
          }
          echo $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git third_party/vcpkg
          third_party\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build C++ core (Release)
        run: |
          cmake --preset windows-mingw-release
          cmake --build --preset windows-mingw-release

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install GNU Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustup component add clippy

      - name: npm install (frontend + desktop)
        run: |
          npm ci --prefix app/frontend
          npm ci --prefix app/desktop

      - name: Build Tauri/Rust side once (produces WebView2Loader.dll)
        # Tauri's bundler auto-includes WebView2Loader.dll for the MSVC target, but not for
        # the GNU/MinGW target this project uses -- prepare_bundle_resources.ps1 bundles it
        # explicitly instead, which requires it to already exist in target/release/. See
        # docs/development.md "Packaging".
        run: cargo build --release --manifest-path app\desktop\src-tauri\Cargo.toml

      - name: Vendor FFmpeg + Python runtime, stage resources
        run: .\scripts\prepare_bundle_resources.ps1

      - name: tauri build (NSIS, with bundled resources)
        run: npm run tauri build -- --config ..\..\app\desktop\src-tauri\tauri.release.conf.json
        working-directory: app/desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: gravity-installer
          path: app/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
